name: Build skill

on:
  push:
    branches: [main]

# Prevent loop: skip bot-authored pushes and already-built release commits.
jobs:
  updater-smoke:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'ci: build dist @')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: bash-prev-release
            updater: bash
            installed_release_version: ""
            python_io_encoding: ""
          - os: windows-latest
            label: bash-legacy-1.3
            updater: bash
            installed_release_version: "1.3"
            python_io_encoding: "cp1252"
          - os: windows-latest
            label: powershell-prev-release
            updater: powershell
            installed_release_version: ""
            python_io_encoding: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read release version
        id: release
        shell: bash
        run: echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build candidate updater artifact
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/build_skill.py build \
            --output dist/nuclear-bug-fix.skill \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}"
          python scripts/build_skill.py write-release-manifest \
            --output dist/release.json \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --artifact dist/nuclear-bug-fix.skill
          python scripts/build_skill.py validate \
            --archive dist/nuclear-bug-fix.skill \
            --manifest dist/release.json \
            --max-size-bytes 5000000

      - name: Smoke test updater (${{ matrix.label }})
        shell: bash
        run: |
          args=(--updater "${{ matrix.updater }}")
          if [[ -n "${{ matrix.installed_release_version }}" ]]; then
            args+=(--installed-release-version "${{ matrix.installed_release_version }}")
          fi
          if [[ -n "${{ matrix.python_io_encoding }}" ]]; then
            args+=(--python-io-encoding "${{ matrix.python_io_encoding }}")
          fi
          python scripts/test_updater.py "${args[@]}"

  build:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'ci: build dist @')
    needs: updater-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT or the default GITHUB_TOKEN.
          # GITHUB_TOKEN is sufficient for same-repo pushes.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML (needed for validation)
        run: pip install pyyaml

      - name: Read release version
        id: release
        run: echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Get commit SHAs
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp version into SKILL.md metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.sha.outputs.full }}
        run: |
          python3 scripts/build_skill.py stamp-version \
            --skill-md SKILL.md \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}"

      - name: Validate SKILL.md
        run: |
          python3 - << 'PYEOF'
          import re, yaml, sys
          from pathlib import Path

          ALLOWED = {"name", "description", "license", "allowed-tools", "metadata", "compatibility"}

          content = Path("SKILL.md").read_text()
          if not content.startswith("---"):
              sys.exit("No frontmatter")
          m = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          if not m:
              sys.exit("Invalid frontmatter")
          fm = yaml.safe_load(m.group(1))
          bad = set(fm) - ALLOWED
          if bad:
              sys.exit(f"Unexpected frontmatter keys: {bad}")
          if "name" not in fm or "description" not in fm:
              sys.exit("Missing required frontmatter fields")
          print("SKILL.md valid")
          PYEOF

      - name: Build .skill file (zip)
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.sha.outputs.full }}
        run: |
          python3 scripts/build_skill.py build \
            --output dist/nuclear-bug-fix.skill \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}"

      - name: Write release manifest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.sha.outputs.full }}
        run: |
          python3 scripts/build_skill.py write-release-manifest \
            --output dist/release.json \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --artifact dist/nuclear-bug-fix.skill

      - name: Validate built artifact
        run: |
          python3 scripts/build_skill.py validate \
            --archive dist/nuclear-bug-fix.skill \
            --manifest dist/release.json \
            --max-size-bytes 5000000

      - name: Commit and push dist + updated SKILL.md
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/nuclear-bug-fix.skill dist/release.json SKILL.md
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "Nothing changed — skip commit"
          else
            git commit -m "ci: build dist @ ${RELEASE_VERSION} [skip ci]"
            git push
            echo "Pushed dist/nuclear-bug-fix.skill (version ${RELEASE_VERSION})"
          fi
