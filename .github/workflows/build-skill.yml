name: Build skill

on:
  push:
    branches: [main]

# Prevent loop: skip when this workflow is the one committing
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT or the default GITHUB_TOKEN.
          # GITHUB_TOKEN is sufficient for same-repo pushes.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML (needed for validation)
        run: pip install pyyaml

      - name: Get short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp version into SKILL.md metadata
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          python3 - << 'PYEOF'
          import re, os
          sha = os.environ["SHORT_SHA"]
          with open("SKILL.md") as f:
              content = f.read()
          # Replace: "  version: <anything>" inside the metadata block
          updated = re.sub(
              r"(^\s{1,4}version:\s*)\S+",
              lambda m: m.group(1) + sha,
              content,
              flags=re.MULTILINE,
          )
          with open("SKILL.md", "w") as f:
              f.write(updated)
          print(f"Stamped version: {sha}")
          PYEOF

      - name: Validate SKILL.md
        run: |
          python3 - << 'PYEOF'
          import re, yaml, sys
          from pathlib import Path

          ALLOWED = {"name", "description", "license", "allowed-tools", "metadata", "compatibility"}

          content = Path("SKILL.md").read_text()
          if not content.startswith("---"):
              sys.exit("No frontmatter")
          m = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          if not m:
              sys.exit("Invalid frontmatter")
          fm = yaml.safe_load(m.group(1))
          bad = set(fm) - ALLOWED
          if bad:
              sys.exit(f"Unexpected frontmatter keys: {bad}")
          if "name" not in fm or "description" not in fm:
              sys.exit("Missing required frontmatter fields")
          print("SKILL.md valid")
          PYEOF

      - name: Build .skill file (zip)
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          python3 scripts/build_skill.py build \
            --output dist/nuclear-bug-fix.skill \
            --version "${SHORT_SHA}"

      - name: Validate built artifact
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          python3 scripts/build_skill.py validate \
            --archive dist/nuclear-bug-fix.skill \
            --expected-version "${SHORT_SHA}" \
            --max-size-bytes 5000000

      - name: Commit and push dist + updated SKILL.md
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/nuclear-bug-fix.skill SKILL.md
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "Nothing changed — skip commit"
          else
            git commit -m "ci: build dist @ ${SHORT_SHA} [skip ci]"
            git push
            echo "Pushed dist/nuclear-bug-fix.skill (version ${SHORT_SHA})"
          fi
