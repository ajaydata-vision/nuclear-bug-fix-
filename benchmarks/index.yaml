suite:
  name: nuclear-bug-fix-benchmarks
  version: 1
  current_case_count: 127
  purpose: Measure first-shot bug-fix accuracy, false-positive rate, and verification quality.

tracks:
  - id: bohrbug-core
    description: Deterministic, reproducible, one-primary-cause bugs.
    current_cases: 53
  - id: regression-version
    description: Dependency, browser, runtime, or documented behavior change regressions.
    current_cases: 7
  - id: deploy-env
    description: Wrong code running, stale assets, env drift, config mismatch, partial rollout.
    current_cases: 32
  - id: intermittent-race
    description: Timing, concurrency, startup, flaky test, and load-amplified failures.
    current_cases: 26
  - id: distributed-multi-factor
    description: Queues, webhooks, gateways, sagas, replica lag, and multi-service interactions.
    current_cases: 9
  - id: evidence-limited
    description: Only logs, partial code, symptom text, or stack trace available. Not yet represented in the committed corpus.
    current_cases: 0

domains:
  - id: frontend
    current_cases: 29
  - id: backend
    current_cases: 31
  - id: integration
    current_cases: 27
  - id: mobile
    current_cases: 2
  - id: general
    current_cases: 11
  - id: version-external-intelligence
    current_cases: 7
  - id: java-enterprise
    description: Servlet lifecycle, JSP scope/include, NIO ByteBuffer/Channel/Selector, Java threading, JVM/ClassLoader, JDBC, Spring Boot (Transactional, Hibernate, bean scope, Security).
    current_cases: 27

scoring:
  first_shot_resolution: 40
  root_cause_accuracy: 25
  fix_accuracy: 20
  verification_quality: 10
  evidence_discipline: 5
  penalties:
    confident_wrong_answer: -40
    root_cause_mismatch: -25
    shotgun_rewrite: -20
    no_verification: -15
    revisits_disproven_path: -10

required_case_information:
  prompt_md:
    - title
    - stack
    - versions
    - reproduction
  evaluator_md:
    - id
    - domain
    - track
    - difficulty
    - determinism
    - one_shot_eligible
    - requires_external_intelligence
    - requires_runtime_access
    - requires_log_access
    - root_cause
    - accepted_fix
  verify_md:
    - before_fix
    - after_fix
    - regression_checks

recommended_case_layout:
  - prompt.md
  - evaluator.md
  - verify.md
  - assets/

starter_backlog_ids:
  - FE-001
  - FE-008
  - FE-019
