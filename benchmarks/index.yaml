suite:
  name: nuclear-bug-fix-benchmarks
  version: 1
  current_case_count: 161
  purpose: Measure first-shot bug-fix accuracy, false-positive rate, and verification quality.

tracks:
  - id: bohrbug-core
    description: Deterministic, reproducible, one-primary-cause bugs.
    current_cases: 70
  - id: regression-version
    description: Dependency, browser, runtime, or documented behavior change regressions.
    current_cases: 8
  - id: deploy-env
    description: Wrong code running, stale assets, env drift, config mismatch, partial rollout.
    current_cases: 38
  - id: intermittent-race
    description: Timing, concurrency, startup, flaky test, and load-amplified failures.
    current_cases: 32
  - id: distributed-multi-factor
    description: Queues, webhooks, gateways, sagas, replica lag, and multi-service interactions.
    current_cases: 9
  - id: evidence-limited
    description: Only logs, partial code, symptom text, or stack trace available.
    current_cases: 2

domains:
  - id: frontend
    current_cases: 32
  - id: backend
    current_cases: 31
  - id: integration
    current_cases: 20
  - id: mobile
    current_cases: 7
  - id: general
    current_cases: 11
  - id: version-external-intelligence
    current_cases: 7
  - id: python-desktop
    description: PyQt6/qasync event loop ownership, async slots, UI-thread affinity, desktop scheduler/websocket interaction, local SQLite in GUI process.
    current_cases: 6
  - id: bridge-adapters
    description: Python-to-Node subprocess bridges, stdout-framed protocols, Baileys-style adapters, websocket relay lifecycle, unofficial scraper drift.
    current_cases: 6
  - id: frozen-runtime
    description: PyInstaller onefile/onedir runtime shape, _MEIPASS resource lookup, hidden imports, Qt plugins, writable state paths, bundled subprocesses.
    current_cases: 6
  - id: java-enterprise
    description: Servlet lifecycle, JSP scope/include/EL/JSTL/taglib, NIO ByteBuffer/Channel/Selector, Java threading, JVM/ClassLoader, JDBC, Spring Boot (Transactional, Async, Scheduling, Cache, Hibernate, bean scope, Security), Kafka consumer patterns.
    current_cases: 30
  - id: react-native
    description: Metro bundler cache, React Navigation, FlatList performance, Reanimated worklets, AsyncStorage null, iOS permissions, EAS build.
    current_cases: 5
  - id: kafka
  - id: php
    description: PHP execution model (shared-nothing, OPcache, headers), type system (loose comparison traps), Laravel (Eloquent, queues, service container, config cache), PHP-FPM (worker exhaustion, timeouts), PDO, Eloquent ORM, PHP version and environment mismatches.
    current_cases: 0
    description: Consumer offset/auto-reset, rebalance storms, poison pill deserialization blocking.
    current_cases: 3

scoring:
  first_shot_resolution: 40
  root_cause_accuracy: 25
  fix_accuracy: 20
  verification_quality: 10
  evidence_discipline: 5
  penalties:
    confident_wrong_answer: -40
    root_cause_mismatch: -25
    shotgun_rewrite: -20
    no_verification: -15
    revisits_disproven_path: -10

required_case_information:
  prompt_md:
    - title
    - stack
    - versions
    - reproduction
  evaluator_md:
    - id
    - domain
    - track
    - difficulty
    - determinism
    - one_shot_eligible
    - requires_external_intelligence
    - requires_runtime_access
    - requires_log_access
    - root_cause
    - accepted_fix
  verify_md:
    - before_fix
    - after_fix
    - regression_checks

recommended_case_layout:
  - prompt.md
  - evaluator.md
  - verify.md
  - assets/

authoring_rules:
  - Prefer symptom text, logs, partial code, and raw artifacts over answer-revealing prompts.
  - Put packaged/runtime evidence in assets/ when the real signal is a startup log, stdout capture, or extracted file tree.
  - Mark one_shot_eligible false when clean-machine or runtime proof is still required after diagnosis.
  - All code paths and import statements in prompt.md must be factually correct.
  - Code comments must point to exact crash location, not nearby lines.
  - requires_log_access must be true when any observability/profiler/monitoring data is used as evidence.
  - determinism must match the prompt description (intermittent if prompt says "sometimes").
  - Root cause must be precisely scoped — do not attribute bug to code that is not the crash cause.
  - partial_credit_conditions must test incomplete-correct answers, not wrong ones.
  - verify.md must use the same variable names and types as prompt.md code.

